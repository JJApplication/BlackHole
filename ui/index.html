<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Black Hole - PKG Service</title>
    <style>
        html, body {
            margin: 0;
            height: 100%;
            background: #070b16;
            overflow: hidden;
        }

        body {
            font-family: Consolas, "SFMono-Regular", Menlo, Monaco, "Ubuntu Mono", monospace;
        }

        canvas {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            display: block;
        }

        .legend {
            position: fixed;
            left: 0;
            right: 0;
            bottom: 0;
            z-index: 2;
            padding: 36px 16px 22px;
            text-align: center;
            color: rgba(236, 230, 220, 0.82);
            font-size: 13px;
            line-height: 1.7;
            letter-spacing: 0.04em;
            background: linear-gradient(to top, rgba(7, 11, 22, 0.88), rgba(7, 11, 22, 0));
            pointer-events: none;
        }

        .legend a {
            color: #b07cff;
            pointer-events: auto;
            text-decoration: none;
        }

        .legend a:hover {
            text-decoration: underline;
        }

        .legend a:focus-visible {
            outline: 1px solid rgba(176, 124, 255, 0.9);
            outline-offset: 3px;
        }

        .gl-error {
            position: fixed;
            z-index: 5;
            left: 16px;
            top: 16px;
            max-width: min(720px, 90vw);
            color: #ffd0c8;
            font-size: 12px;
            white-space: pre-wrap;
        }

        @media (max-width: 768px) {
            .legend {
                font-size: 12px;
                padding-bottom: 16px;
            }
        }
    </style>
</head>
<body>
    <canvas id="bh" aria-label="黑洞"></canvas>
    <div class="legend">
        <div>${pkg}/static/:repo@version/:file</div>
        <div>By <a href="//Renj.io">Renj.io</a></div>
    </div>
    <script>
        const canvas = document.getElementById("bh");
        const gl = canvas.getContext("webgl", {
            alpha: false,
            antialias: false,
            depth: false,
            stencil: false,
            powerPreference: "high-performance"
        });

        const FRAG = `
precision highp float;
uniform vec2 uRes;
uniform float uTime;

const float PI = 3.14159265;
const float SHADOW = 0.142;
const float DISK_IN = 0.168;
const float DISK_OUT = 0.60;
const float TILT_S = 0.255;
const float TILT_C = 0.96694;

float hash2(vec2 p) {
    vec3 p3 = fract(vec3(p.xyx) * 0.1031);
    p3 += dot(p3, p3.yzx + 33.33);
    return fract((p3.x + p3.y) * p3.z);
}

float celBand(float x, float edge, float w) {
    return smoothstep(edge - w, edge + w, x);
}

vec4 evalDisk(float r, float phi, float time, float boost) {
    float span = smoothstep(DISK_IN - 0.004, DISK_IN + 0.004, r) *
                 (1.0 - smoothstep(DISK_OUT - 0.005, DISK_OUT + 0.004, r));
    if (span <= 0.001) return vec4(0.0);

    float t = clamp((r - DISK_IN) / (DISK_OUT - DISK_IN), 0.0, 1.0);
    float doppler = clamp(0.5 + 0.5 * cos(phi), 0.0, 1.0);
    float hotSide = celBand(doppler, 0.44, 0.16);
    float blazingSide = celBand(doppler, 0.70, 0.12);

    // 2D cel-shaded base tiers (bold, clean anime shading)
    vec3 cOuter = mix(vec3(0.38, 0.08, 0.11), vec3(0.76, 0.20, 0.09), hotSide);
    vec3 cMid1  = mix(vec3(0.70, 0.18, 0.09), vec3(0.96, 0.42, 0.12), hotSide);
    vec3 cMid2  = mix(vec3(0.94, 0.41, 0.13), vec3(1.00, 0.70, 0.19), hotSide);
    vec3 cInner = mix(vec3(1.00, 0.68, 0.22), vec3(1.00, 0.91, 0.56), hotSide);

    vec3 col = cInner;
    col = mix(col, cMid2, celBand(t, 0.24, 0.02));
    col = mix(col, cMid1, celBand(t, 0.54, 0.02));
    col = mix(col, cOuter, celBand(t, 0.80, 0.02));

    // Crisp animated swirling plasma ribbons along Keplerian orbits
    float omega = 1.15 * pow(0.30 / max(r, 0.16), 1.25);
    float a1 = phi - time * omega;
    float a2 = phi - time * (omega * 1.42) + 1.9;

    float lane1 = sin(t * 16.0 + sin(a1 * 2.0) * 0.45);
    float arc1 = smoothstep(0.18, 0.46, cos(a1 * 2.0 + t * 4.2)) * celBand(lane1, 0.42, 0.10) * (1.0 - smoothstep(0.66, 0.86, t));
    float darkGap = celBand(-lane1, 0.56, 0.09) * smoothstep(0.14, 0.34, t) * (1.0 - smoothstep(0.76, 0.95, t));

    float lane2 = sin(t * 25.0 - sin(a2 * 3.0) * 0.35);
    float arc2 = smoothstep(0.52, 0.76, cos(a2 * 3.0 + t * 6.0)) * celBand(lane2, 0.54, 0.10) * (1.0 - smoothstep(0.52, 0.84, t));

    col = mix(col, col * vec3(0.56, 0.40, 0.42), darkGap * 0.62);
    col = mix(col, mix(vec3(1.00, 0.80, 0.36), vec3(1.00, 0.97, 0.86), hotSide), arc1 * 0.72);
    col = mix(col, vec3(1.00, 0.99, 0.94), arc2 * 0.85);

    // Crisp Doppler crescent highlight & inner rim accent
    float innerRim = 1.0 - celBand(t, 0.06, 0.02);
    float specArc = blazingSide * (1.0 - celBand(t, 0.42, 0.07)) * boost;
    col = mix(col, vec3(1.00, 0.98, 0.92), max(innerRim * 0.65, specArc * 0.75));

    // Orbiting bright energy motes with short curved trails
    for (int i = 0; i < 4; i++) {
        float fi = float(i);
        float mt = 0.18 + fi * 0.19;
        float mr = mix(DISK_IN + 0.02, DISK_OUT - 0.03, mt);
        float mSpeed = 1.15 * pow(0.32 / mr, 1.25);
        float ma = fi * 1.57 + 0.6 + time * mSpeed;
        float dPhi = mod(phi - ma + PI, 2.0 * PI) - PI;
        float trail = smoothstep(-0.32, 0.0, dPhi) * step(dPhi, 0.05);
        float dr = abs(r - mr) / (0.008 + 0.004 * (1.0 - smoothstep(-0.22, 0.0, dPhi)));
        float head = exp(-pow((r - mr) / 0.0085, 2.0) - pow(dPhi / 0.032, 2.0));
        float tail = trail * exp(-dr * dr * 1.8) * smoothstep(-0.30, 0.0, dPhi) * 0.65;
        float mote = clamp(head + tail, 0.0, 1.0);
        col = mix(col, vec3(1.00, 0.99, 0.94), celBand(mote, 0.42, 0.16));
    }

    return vec4(col, span);
}

vec3 stars(vec2 q, float time) {
    vec3 col = vec3(0.0);
    for (int layer = 0; layer < 2; layer++) {
        float fl = float(layer);
        float scale = 6.5 + fl * 5.0;
        vec2 sp = q * scale + vec2(fl * 13.7, fl * 7.3);
        vec2 id = floor(sp);
        vec2 f = fract(sp) - 0.5;
        float n = hash2(id + fl * 31.0);
        if (n > 0.86) {
            vec2 g = f - (vec2(hash2(id + 1.7), hash2(id + 4.1)) - 0.5) * 0.62;
            float d = length(g);
            float mag = hash2(id + 8.0);
            float rStar = (0.036 + mag * 0.035) * (1.0 - fl * 0.25);
            float core = 1.0 - smoothstep(rStar * 0.55, rStar * 1.15, d);
            float tw = 0.65 + 0.35 * sin(time * (1.4 + mag * 2.2) + n * 29.0);
            vec3 tint = mix(vec3(0.76, 0.87, 1.0), vec3(1.0, 0.91, 0.74), step(0.52, mag));
            float crossSpark = step(0.955, n) * (1.0 - fl) *
                max(exp(-abs(g.x) * 34.0) * exp(-abs(g.y) * 5.5),
                    exp(-abs(g.y) * 34.0) * exp(-abs(g.x) * 5.5)) * 0.75;
            col += tint * (core + crossSpark) * tw;
        }
    }
    return col;
}

void main() {
    float scale = min(uRes.y, uRes.x / 1.42);
    vec2 uv = (gl_FragCoord.xy - 0.5 * uRes) / scale;
    vec2 rawP = uv - vec2(0.0, 0.03);

    // Slight dynamic tilt for 2D animation composition
    float tiltAng = -0.19;
    float cs = cos(tiltAng);
    float sn = sin(tiltAng);
    vec2 p = vec2(rawP.x * cs - rawP.y * sn, rawP.x * sn + rawP.y * cs);

    float b = max(length(p), 1e-4);
    vec2 dir = p / b;

    // Deep stylized night sky + warm inner cosmic glow
    vec3 sky = mix(vec3(0.072, 0.102, 0.210), vec3(0.022, 0.032, 0.078), smoothstep(0.0, 1.05, length(uv)));
    sky += vec3(0.06, 0.035, 0.12) * exp(-pow(b / 0.58, 2.0)) * 0.55;
    sky += vec3(0.22, 0.09, 0.04) * exp(-pow(b / 0.28, 2.0)) * 0.45;

    // Lensed background stars
    float starDeflect = 0.09 / max(b, 0.19);
    vec2 q = p * (1.0 - starDeflect);
    float starMask = smoothstep(SHADOW * 1.05, SHADOW * 1.85, b);
    vec3 col = sky + stars(q, uTime) * starMask;

    // Layer 1: Gravitationally lensed far-side disk (smooth convex upper arch + lower crescent)
    float k = 1.0 + 0.17 / (b + 0.13);
    float thetaPrimary = atan(dir.y * TILT_C, TILT_S);
    float argPrimary = thetaPrimary / k;
    vec4 farPrimary = vec4(0.0);
    if (dir.y > -0.04 && argPrimary < 1.54) {
        float rFar = b / cos(argPrimary);
        float uFar = rFar * cos(thetaPrimary) * dir.x;
        float vFar = rFar * (cos(thetaPrimary) * dir.y * TILT_S + sin(thetaPrimary) * TILT_C);
        farPrimary = evalDisk(rFar, atan(vFar, uFar), uTime, 0.85);
    }

    float thetaSecondary = PI + thetaPrimary;
    float argSecondary = thetaSecondary / k;
    vec4 farSecondary = vec4(0.0);
    if (dir.y < -0.02 && argSecondary < 1.54) {
        float rSub = b / cos(argSecondary);
        float uSub = rSub * cos(thetaSecondary) * dir.x;
        float vSub = rSub * (cos(thetaSecondary) * dir.y * TILT_S + sin(thetaSecondary) * TILT_C);
        farSecondary = evalDisk(rSub, atan(vSub, uSub), uTime, 0.78);
    }

    col = mix(col, farSecondary.rgb, farSecondary.a);
    col = mix(col, farPrimary.rgb, farPrimary.a);

    // Layer 2: Event horizon shadow + crisp 2D photon ring
    float hole = 1.0 - smoothstep(SHADOW - 0.003, SHADOW + 0.002, b);
    float outerHalo = exp(-pow((b - SHADOW - 0.007) / 0.016, 2.0)) * (1.0 - hole);
    float photon = exp(-pow((b - SHADOW - 0.0025) / 0.005, 2.0));
    float glint = pow(max(cos(atan(p.y, p.x) - uTime * 0.95), 0.0), 18.0);
    col += vec3(1.0, 0.56, 0.20) * outerHalo * 0.50;
    col = mix(col, vec3(0.0), hole);
    col += vec3(1.0, 0.88, 0.58) * photon * (0.95 + 0.35 * glint);
    col += vec3(1.0, 0.99, 0.96) * photon * (0.45 + 0.85 * glint);

    // Layer 3: Near-side equatorial disk crossing in front of the black hole
    float rFront = length(vec2(p.x, p.y / TILT_S));
    float phiFront = atan(p.y / TILT_S, p.x);
    float frontHalf = smoothstep(0.003, -0.003, p.y);
    vec4 frontDisk = evalDisk(rFront, phiFront, uTime, 1.0);
    float frontAlpha = frontDisk.a * frontHalf;
    float overShadow = frontAlpha * (1.0 - smoothstep(SHADOW + 0.025, SHADOW - 0.005, b));
    vec3 frontRgb = frontDisk.rgb + vec3(0.16, 0.12, 0.07) * (1.0 - smoothstep(DISK_IN, DISK_IN + 0.016, rFront)) * overShadow;
    // Subtle dark separation edge along the bottom of the front crossing so the lower crescent pops
    float bottomEdge = smoothstep(DISK_OUT - 0.025, DISK_OUT - 0.004, rFront) * farSecondary.a * frontHalf;
    frontRgb = mix(frontRgb, frontRgb * 0.55, bottomEdge * 0.65);
    col = mix(col, frontRgb, frontAlpha);

    gl_FragColor = vec4(clamp(col, 0.0, 1.0), 1.0);
}
`;

        function compile(type, source) {
            const shader = gl.createShader(type);
            gl.shaderSource(shader, source);
            gl.compileShader(shader);
            if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
                const log = gl.getShaderInfoLog(shader) || "shader compile failed";
                gl.deleteShader(shader);
                throw new Error(log);
            }
            return shader;
        }

        function showError(error) {
            const note = document.createElement("pre");
            note.className = "gl-error";
            note.textContent = error && error.message ? error.message : String(error);
            document.body.appendChild(note);
        }

        if (!gl) {
            showError(new Error("WebGL unavailable"));
        } else {
            try {
                const program = gl.createProgram();
                gl.attachShader(program, compile(gl.VERTEX_SHADER, "attribute vec2 aPos; void main(){ gl_Position = vec4(aPos, 0.0, 1.0); }"));
                gl.attachShader(program, compile(gl.FRAGMENT_SHADER, FRAG));
                gl.linkProgram(program);
                if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {
                    throw new Error(gl.getProgramInfoLog(program) || "link failed");
                }
                gl.useProgram(program);

                const buffer = gl.createBuffer();
                gl.bindBuffer(gl.ARRAY_BUFFER, buffer);
                gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
                const aPos = gl.getAttribLocation(program, "aPos");
                gl.enableVertexAttribArray(aPos);
                gl.vertexAttribPointer(aPos, 2, gl.FLOAT, false, 0, 0);

                const uRes = gl.getUniformLocation(program, "uRes");
                const uTime = gl.getUniformLocation(program, "uTime");
                const reduced = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

                function resize() {
                    const dpr = Math.min(window.devicePixelRatio || 1, 1.5);
                    let w = window.innerWidth * dpr;
                    let h = window.innerHeight * dpr;
                    const budget = 1600 * 900;
                    if (w * h > budget) {
                        const scale = Math.sqrt(budget / (w * h));
                        w *= scale;
                        h *= scale;
                    }
                    canvas.width = Math.max(2, Math.round(w));
                    canvas.height = Math.max(2, Math.round(h));
                }

                window.addEventListener("resize", resize);
                resize();

                const start = performance.now();
                function frame(now) {
                    const t = reduced ? 1.2 : (now - start) / 1000;
                    gl.viewport(0, 0, canvas.width, canvas.height);
                    gl.uniform2f(uRes, canvas.width, canvas.height);
                    gl.uniform1f(uTime, t);
                    gl.drawArrays(gl.TRIANGLES, 0, 3);
                    requestAnimationFrame(frame);
                }
                requestAnimationFrame(frame);
            } catch (error) {
                showError(error);
            }
        }
    </script>
</body>
</html>
